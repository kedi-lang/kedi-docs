[project.theme]
language = "en"
custom_dir = "overrides"
font = false
logo = "assets/brand/kedi-logo.svg"
favicon = "assets/brand/kedi-favicon.webp"
features = [
  "navigation.instant",
  "navigation.indexes",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
]

[project.theme.icon]
repo = "fontawesome/brands/github"
menu = "lucide/menu"
search = "lucide/search"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/kedi-lang"
name = "Kedi on GitHub"

[[project.extra.social]]
icon = "simple/huggingface"
link = "https://huggingface.co/kedi-lang"
name = "Kedi on Hugging Face"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/kedi-lang/"
name = "Kedi on LinkedIn"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:hello@kedi-lang.org"
name = "Email Kedi"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
title = "On this page"
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "kedi", class = "kedi", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
