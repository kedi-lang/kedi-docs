name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Kedi repository access
        env:
          KEDI_REPOSITORY_TOKEN: ${{ secrets.KEDI_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$KEDI_REPOSITORY_TOKEN" ]; then
            echo "::error::KEDI_REPOSITORY_TOKEN must grant read access to kedi-lang/kedi"
            exit 1
          fi

      - name: Check out Kedi stable
        uses: actions/checkout@v6
        with:
          repository: kedi-lang/kedi
          ref: stable
          token: ${{ secrets.KEDI_REPOSITORY_TOKEN }}
          path: .kedi-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install documentation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt \
            ./.kedi-source

      - name: Validate Kedi examples and adapter metadata
        run: |
          python scripts/validate_kedi_examples.py
          python scripts/sync_capability_matrix.py --check

      - name: Build documentation
        run: python scripts/build_docs.py

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: kedi-lang.org
          force_orphan: true
