name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Kedi repository access
        env:
          KEDI_REPOSITORY_TOKEN: ${{ secrets.KEDI_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$KEDI_REPOSITORY_TOKEN" ]; then
            echo "::error::KEDI_REPOSITORY_TOKEN must grant read access to kedi-lang/kedi and kedi-lang/tree-sitter-kedi"
            exit 1
          fi

      - name: Wait for Kedi stable to reference this documentation revision
        env:
          GH_TOKEN: ${{ secrets.KEDI_REPOSITORY_TOKEN }}
        timeout-minutes: 6
        run: |
          for attempt in {1..30}; do
            revision="$(
              gh api "repos/kedi-lang/kedi/contents/kedi-docs?ref=stable" \
                --jq .sha 2>/dev/null || true
            )"
            if [ "$revision" = "$GITHUB_SHA" ]; then
              echo "Kedi stable references documentation revision $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for Kedi stable to reference $GITHUB_SHA (attempt $attempt/30)"
            sleep 10
          done
          echo "::error::Kedi stable does not reference documentation revision $GITHUB_SHA"
          exit 1

      - name: Check out Kedi stable
        uses: actions/checkout@v6
        with:
          repository: kedi-lang/kedi
          ref: stable
          token: ${{ secrets.KEDI_REPOSITORY_TOKEN }}
          path: .kedi-source
          persist-credentials: false

      - name: Resolve pinned tree-sitter-kedi revision
        id: tree-sitter-kedi
        run: |
          revision="$(git -C .kedi-source ls-tree HEAD tree-sitter-kedi | awk '{print $3}')"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The selected Kedi revision does not contain a valid tree-sitter-kedi gitlink"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out pinned tree-sitter-kedi
        uses: actions/checkout@v6
        with:
          repository: kedi-lang/tree-sitter-kedi
          ref: ${{ steps.tree-sitter-kedi.outputs.revision }}
          token: ${{ secrets.KEDI_REPOSITORY_TOKEN }}
          path: .tree-sitter-kedi-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install documentation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt \
            ./.tree-sitter-kedi-source \
            ./.kedi-source

      - name: Validate Kedi examples and adapter metadata
        run: |
          python scripts/validate_kedi_examples.py
          python scripts/sync_capability_matrix.py --check

      - name: Build documentation
        run: python scripts/build_docs.py

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: kedi-lang.org
          force_orphan: true
