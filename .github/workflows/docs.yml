name: Documentation

# Publishes the documentation revision that Kedi `stable` references, which is not always the
# latest push: documentation lands on main before the Kedi pull request that bumps the gitlink
# is merged. A schedule picks up that merge; runs whose target is already published skip.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-${{ github.ref }}
  # A scheduled check must not cancel a deployment in progress.
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-24.04
    outputs:
      kedi: ${{ steps.target.outputs.kedi }}
      docs: ${{ steps.target.outputs.docs }}
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - name: Resolve the documentation revision Kedi stable references
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! kedi="$(gh api repos/kedi-lang/kedi/commits/stable --jq .sha)" ||
            ! docs="$(gh api "repos/kedi-lang/kedi/contents/kedi-docs?ref=$kedi" --jq .sha)"; then
            echo "::error::Could not read Kedi stable from kedi-lang/kedi"
            exit 1
          fi
          for revision in "$kedi" "$docs"; do
            if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve Kedi stable and its kedi-docs gitlink"
              exit 1
            fi
          done
          published="$(gh api \
            'repos/kedi-lang/kedi-docs/contents/deployment.json?ref=gh-pages' \
            --jq '.content | @base64d | fromjson | .docs' 2>/dev/null || true)"
          [[ "$published" =~ ^[0-9a-f]{40}$ ]] || published=""
          deploy=true
          if [ "$published" = "$docs" ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            deploy=false
            echo "Documentation revision $docs is already published"
          elif [ "$docs" != "$GITHUB_SHA" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::notice::Kedi stable references $docs, not $GITHUB_SHA yet; publishing $docs. The schedule publishes $GITHUB_SHA once a Kedi stable commit references it."
          fi
          {
            echo "kedi=$kedi"
            echo "docs=$docs"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: target
    if: needs.target.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the referenced documentation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.target.outputs.docs }}

      - name: Check out Kedi stable
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kedi-lang/kedi
          ref: ${{ needs.target.outputs.kedi }}
          path: .kedi-source
          persist-credentials: false

      - name: Resolve pinned tree-sitter-kedi revision
        id: tree-sitter-kedi
        run: |
          revision="$(git -C .kedi-source ls-tree HEAD tree-sitter-kedi | awk '{print $3}')"
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The selected Kedi revision does not contain a valid tree-sitter-kedi gitlink"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out pinned tree-sitter-kedi
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kedi-lang/tree-sitter-kedi
          ref: ${{ steps.tree-sitter-kedi.outputs.revision }}
          path: .tree-sitter-kedi-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install documentation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-docs.txt \
            ./.tree-sitter-kedi-source \
            ./.kedi-source
          npm ci --ignore-scripts

      - name: Verify preinstalled Chrome
        run: google-chrome --version

      - name: Validate and build documentation
        run: |
          python scripts/validate_kedi_examples.py
          python scripts/sync_capability_matrix.py --check
          python scripts/build_docs.py
          python -m unittest discover -s tests -v
          npm run test:browser

      - name: Record the published revisions
        env:
          KEDI: ${{ needs.target.outputs.kedi }}
          DOCS: ${{ needs.target.outputs.docs }}
        run: |
          jq -n --arg kedi "$KEDI" --arg docs "$DOCS" '{kedi: $kedi, docs: $docs}' \
            > site/deployment.json

      - name: Publish documentation
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: docs.kedi-lang.org
          force_orphan: true
